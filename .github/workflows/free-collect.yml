# Free tier collector. Every ~10 minutes it asks Lead Finder whether a free collection is
# waiting; if so it reads Overture Maps open data and sends the businesses back.
# A second job checks businesses' websites the same way (scripts/website_check.py).
# No stored secret: GitHub signs a short-lived pass for this workflow (OpenID Connect) and
# Lead Finder checks it came from this repository's free-collect.yml on main.
# Public repositories get unlimited free Actions minutes; an idle check takes ~10 seconds.
name: Free collector (Overture Maps)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      import_id:
        description: Lead Finder collection id (leave empty to take the next waiting one)
        required: false

permissions:
  contents: read
  id-token: write

env:
  LEAD_FINDER_URL: ${{ vars.LEAD_FINDER_URL || 'https://lead-scraper.dev1-024.workers.dev' }}

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # One collection at a time; website checks have their own queue so they never hold this up.
    concurrency:
      group: free-collector
      cancel-in-progress: false
    steps:
      - name: Ask Lead Finder for work
        id: ask
        run: |
          if [ -n "${{ inputs.import_id }}" ]; then echo "import_id=${{ inputs.import_id }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lead-finder" | jq -r .value)
          echo "::add-mask::$TOKEN"
          RES=$(curl -sS -f -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' "$LEAD_FINDER_URL/api/free/collector/next")
          ID=$(echo "$RES" | jq -r '.importId // empty')
          echo "import_id=$ID" >> "$GITHUB_OUTPUT"
          if [ -z "$ID" ]; then echo "Nothing waiting."; fi
      - if: steps.ask.outputs.import_id != ''
        uses: actions/checkout@v7
      - if: steps.ask.outputs.import_id != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: steps.ask.outputs.import_id != ''
        run: pip install duckdb==1.5.6
      - if: steps.ask.outputs.import_id != ''
        name: Collect
        run: python scripts/overture_collect.py --import "${{ steps.ask.outputs.import_id }}"
        env:
          LEAD_FINDER_RUNNER: github

  websites:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: website-check
      cancel-in-progress: false
    steps:
      - name: Ask Lead Finder for websites to check
        id: ask
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lead-finder" | jq -r .value)
          echo "::add-mask::$TOKEN"
          RES=$(curl -sS -f -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' "$LEAD_FINDER_URL/api/free/collector/websites/waiting")
          W=$(echo "$RES" | jq -r '.waiting // false')
          echo "waiting=$W" >> "$GITHUB_OUTPUT"
          if [ "$W" != "true" ]; then echo "No websites waiting (or today's limit is reached)."; fi
      - if: steps.ask.outputs.waiting == 'true'
        uses: actions/checkout@v7
      - if: steps.ask.outputs.waiting == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: steps.ask.outputs.waiting == 'true'
        name: Check websites
        run: python scripts/website_check.py

  registry:
    # Owners from state business registries (Florida's full file at most once a day; NY, PA,
    # OR, CT and CO one business at a time).
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: registry
      cancel-in-progress: false
    steps:
      - name: Ask Lead Finder which states are waiting
        id: ask
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lead-finder" | jq -r .value)
          echo "::add-mask::$TOKEN"
          RES=$(curl -sS -f -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' "$LEAD_FINDER_URL/api/free/collector/registry/waiting")
          STATES=$(echo "$RES" | jq -r '(.states // []) | join(" ")')
          echo "states=$STATES" >> "$GITHUB_OUTPUT"
          if [ -z "$STATES" ]; then echo "No owner look-ups waiting."; fi
      - if: steps.ask.outputs.states != ''
        uses: actions/checkout@v7
      - if: steps.ask.outputs.states != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: contains(steps.ask.outputs.states, 'FL')
        run: pip install paramiko==3.5.1
      # Florida's full files (companies ~1.8 GB, trade names ~75 MB) change once a quarter: keep them between runs.
      - if: contains(steps.ask.outputs.states, 'FL')
        id: quarter
        run: echo "key=sunbiz-v2-$(date -u +%Y)-q$(( ($(date -u +%-m) - 1) / 3 + 1 ))" >> "$GITHUB_OUTPUT"
      - if: contains(steps.ask.outputs.states, 'FL')
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sunbiz
          key: ${{ steps.quarter.outputs.key }}
      - if: steps.ask.outputs.states != ''
        name: Look up owners
        run: |
          mkdir -p "$RUNNER_TEMP/sunbiz"
          for S in ${{ steps.ask.outputs.states }}; do
            python scripts/registry_owners.py --state "$S" --workdir "$RUNNER_TEMP/sunbiz" || echo "Owner look-up for $S didn't finish; it is retried next run."
          done

  ppp:
    # Company size ranges from the SBA PPP loan records (scripts/ppp_match.py). The first run
    # streams the national files (~5 GB, final release) and keeps a compact copy per state in
    # the Actions cache, so later runs skip the download.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ppp
      cancel-in-progress: false
    steps:
      - name: Ask Lead Finder which states are waiting
        id: ask
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lead-finder" | jq -r .value)
          echo "::add-mask::$TOKEN"
          RES=$(curl -sS -f -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' "$LEAD_FINDER_URL/api/free/collector/ppp/waiting")
          STATES=$(echo "$RES" | jq -r '(.states // []) | join(" ")')
          echo "states=$STATES" >> "$GITHUB_OUTPUT"
          echo "key=ppp-v1-$(echo "$STATES" | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          if [ -z "$STATES" ]; then echo "No size look-ups waiting (or today's limit is reached)."; fi
      - if: steps.ask.outputs.states != ''
        uses: actions/checkout@v7
      - if: steps.ask.outputs.states != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The loan records never change: one cache entry per set of states, saved once every
      # state's file is complete (never an empty or partial copy, since cache keys can't be replaced).
      - if: steps.ask.outputs.states != ''
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ppp
          key: ${{ steps.ask.outputs.key }}
      - if: steps.ask.outputs.states != ''
        name: Match businesses to PPP loans
        id: match
        run: |
          mkdir -p "$RUNNER_TEMP/ppp"
          python scripts/ppp_match.py --states "${{ steps.ask.outputs.states }}" --workdir "$RUNNER_TEMP/ppp" || echo "PPP look-up didn't finish; it is retried next run."
          ALL=true
          for S in ${{ steps.ask.outputs.states }}; do [ -s "$RUNNER_TEMP/ppp/ppp_$S.tsv.gz" ] || ALL=false; done
          echo "complete=$ALL" >> "$GITHUB_OUTPUT"
      - if: steps.ask.outputs.states != '' && steps.restore.outputs.cache-hit != 'true' && steps.match.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ppp
          key: ${{ steps.ask.outputs.key }}
