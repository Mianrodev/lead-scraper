# Free tier collector. Lead Finder starts this (workflow_dispatch) when someone presses
# "Collect for free"; it reads Overture Maps open data and sends the businesses back.
# Needs the repository secret LEAD_FINDER_COLLECTOR_SECRET (same value as the Worker's
# FREE_COLLECTOR_SECRET). Public repositories get unlimited free Actions minutes.
name: Free collector (Overture Maps)

on:
  workflow_dispatch:
    inputs:
      import_id:
        description: Lead Finder collection id
        required: true

concurrency:
  group: free-collector-${{ inputs.import_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.5.6
      - name: Collect
        run: python scripts/overture_collect.py --import "${{ inputs.import_id }}"
        env:
          LEAD_FINDER_URL: ${{ vars.LEAD_FINDER_URL || 'https://lead-scraper.dev1-024.workers.dev' }}
          LEAD_FINDER_COLLECTOR_SECRET: ${{ secrets.LEAD_FINDER_COLLECTOR_SECRET }}
          LEAD_FINDER_RUNNER: github
