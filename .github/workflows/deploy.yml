# Release from GitHub, not from anyone's computer. Every push to main that changes the app:
# type-check and tests, then the database updates (migrations/), then both Workers (the internal
# app and the store). If a check fails, nothing is released.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token that can edit Workers and D1 (see docs/deploy.md)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# Until they're set, this workflow stops at "Check the Cloudflare secrets" and releases nothing.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "wrangler.store.jsonc"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in order; a newer push waits for the one before it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npx vitest run
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (see docs/deploy.md). Nothing was released."
            exit 1
          fi
      - name: Database updates
        run: npx wrangler d1 migrations apply lead-scraper-db --remote
      - name: Release the internal app
        run: npx wrangler deploy
      - name: Release the store
        run: npx wrangler deploy -c wrangler.store.jsonc
